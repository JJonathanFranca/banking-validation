apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-validation
  namespace: banking-service
  labels:
    app: banking-validation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: banking-validation
  template:
    metadata:
      labels:
        app: banking-validation
    spec:
      containers:
        - name: banking-validation
          image: joao0212/banking-validation:v8
          ports:
            - containerPort: 8181
          env:
            - name: QUARKUS_KAFKA_HOST
              value: "kafka"
            - name: QUARKUS_KAFKA_PORT
              value: "9092"
            - name: QUARKUS_DATASOURCE_USERNAME
              value: "joao"
            - name: QUARKUS_DATASOURCE_PASSWORD
              value: "joao"
            - name: QUARKUS_DATASOURCE_HOST
              value: "postgres-validation"
            - name: QUARKUS_DATASOURCE_PORT
              value: "5432"

---
apiVersion: v1
kind: Service
metadata:
  name: banking-validation-service
  namespace: banking-service
spec:
  selector:
    app: banking-validation
  ports:
    - port: 8181
      targetPort: 8181
      nodePort: 30002
  type: NodePort
